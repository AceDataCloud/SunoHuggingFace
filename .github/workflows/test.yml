name: Validate Space
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - name: Build and check standalone Space archives
        run: |
          python3 scripts/build_spaces.py
          python3 scripts/check_space_packages.py
      - name: Make the standalone ACE Music Space available for download
        uses: actions/upload-artifact@v4
        with:
          name: acemusic-static-space
          path: artifacts/acemusic-static-space.zip
          if-no-files-found: error
